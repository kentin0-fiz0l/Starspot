name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies (starspot)
        working-directory: ./starspot
        run: npm ci

      - name: Run tests (starspot)
        working-directory: ./starspot
        run: npm test

      - name: Build (starspot)
        working-directory: ./starspot
        run: npm run build
