name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'starspot/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'starspot/**'
      - '.github/workflows/ci.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node }}-starspot-${{ hashFiles('starspot/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-starspot-
            ${{ runner.os }}-node-${{ matrix.node }}-

      - name: Install dependencies (starspot)
        working-directory: ./starspot
        run: |
          npm ci

      - name: Cache node_modules (starspot)
        uses: actions/cache@v4
        with:
          path: starspot/node_modules
          key: ${{ runner.os }}-node-modules-starspot-${{ hashFiles('starspot/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-starspot-
            ${{ runner.os }}-

      - name: Run tests (starspot)
        working-directory: ./starspot
        run: npm test

      - name: Build (starspot)
        working-directory: ./starspot
        run: npm run build

      - name: Cache .next (starspot)
        uses: actions/cache@v4
        with:
          path: starspot/.next
          key: ${{ runner.os }}-nextjs-starspot-${{ hashFiles('starspot/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-starspot-
            ${{ runner.os }}-
